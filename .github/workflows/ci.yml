name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  quality-and-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer run lint:phpcs

      - name: Run PHPStan
        run: composer run lint:phpstan

      - name: Run unit tests
        run: |
          if [ -d tests ] && [ "$(find tests -name '*Test.php' | wc -l)" -gt 0 ]; then
            composer run test
          else
            echo "No unit tests found in this repository."
          fi

  cross-repo-smoke:
    uses: dlange97/helper-scripts/.github/workflows/smoke.yml@develop
